<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mental Health Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <h1>Mental Health Score</h1>
    </header>
     <div class="topnav">
        <a href="/" style="border-radius: 28px;color: #819A91;margin-bottom: 30px;margin-top: 20px;background-color: black;">↩ Go Home</a>
    </div>
    <section class="content-layout">
      <div class="right-column">
        <main class="form-card">
          <form id="prediction-form">
            <div class="field-group">
              <label for="age">Age</label>
              <input id="age" name="age" type="number" placeholder="Enter Your Age" min="0" max="100" step="1" required>
            </div>
            <div class="field-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected hidden>Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div class="field-group">
                <label for="country">Country</label>
                <select id="country-select" name="country" required>
                    <option value="" disabled selected hidden>Select</option>
                    
                </select>
            </div>
            <div class="field-group">
                <label for="academic_level">Academic Level</label>
                <select id="academic_level" name="academic_level" required>
                    <option value="" disabled selected hidden>Select</option>
                    <option value="High School">High School</option>
                    <option value="Undergraduate">Undergraduate</option>
                    <option value="Graduate">Graduate</option>
                </select>
            </div>
            <div class="field-group">
                <label for="most_used_platform">Most Used Platform</label>
                <select id="most_used_platform" name="most_used_platform" required>
                    <option value="" disabled selected hidden>Select</option>
                    <option value="Facebook">Facebook</option>
                    <option value="LinkedIn">LinkedIn</option>
                    <option value="Instagram">Instagram</option>
                    <option value="Snapchat">Snapchat</option>
                    <option value="Twitter">Twitter</option>
                    <option value="YouTube">YouTube</option>
                    <option value="TikTok">TikTok</option>
                    <option value="LINE">LINE</option>
                    <option value="KakaoTalk">KakaoTalk</option>
                    <option value="VKontakte">VKontakte</option>
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="WeChat">WeChat</option>
                </select>
            </div>
            <div class="field-group">
                <label for="purpose_of_use">Purpose Of Use</label>
                <select id="purpose_of_use" name="purpose_of_use" required>
                    <option value="" disabled selected hidden>Select</option>
                    <option value="Networking">Networking</option>
                    <option value="Education">Education</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="News">News</option>
                </select>
            </div>
            <div class="field-group">
              <label for="avg_daily_usage_hours">Average Daily Usage Hours</label>
              <input id="avg_daily_usage_hours" name="avg_daily_usage_hours" type="number" placeholder="Your Average Daily Usage Hours" min="0" max="24" step="1" required>
            </div>
            <div class="field-group">
              <label for="daily_unlocks">Daily Unlocks</label>
              <input id="daily_unlocks" name="daily_unlocks" type="number" placeholder="Your Daily Unlocks" min="0" max="10000" step="1" required>
            </div>
            <div class="field-group">
              <label for="study_hours">Study Hours</label>
              <input id="study_hours" name="study_hours" type="number" placeholder="Study Hours" min="0" max="24" step="1" required>
            </div>
            <div class="field-group">
              <label for="physical_activity_hours">Physical Activity Hours</label>
              <input id="physical_activity_hours" name="physical_activity_hours" type="number" placeholder="Physical Activity Hours" min="0" max="24" step="1" required>
            </div>
            <div class="field-group">
              <label for="sleep_hours_per_night">Sleep Hours Per Night</label>
              <input id="sleep_hours_per_night" name="sleep_hours_per_night" type="number" placeholder="Sleep Hours Per Night" min="0" max="24" step="1" required>
            </div>
            <div class="field-group">
                <label for="stress_level">Stress Level</label>
                <select id="stress_level" name="stress_level" required>
                    <option value="" disabled selected hidden>Select</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                    <option value="Very High">Very High</option>
                </select>
            </div>
            <button type="submit">Predict Your Mental Health Score</button>
          </form>
        </main>
      </div>
    </section>

    <section class="results-area">
      <div class="results-card">
        <p class="results-label">Estimated Score</p>
        <h2 id="result-display" class="results-value">0.00</h2>
      </div>
    </section>
    <div id="results" class="screen">
        <p class="band-eyebrow" id="bandEyebrow"></p>
        <h2 class="band-headline" id="bandHeadline"></h2>
        <p class="band-body" id="bandBody"></p>
        <p class="disclaimer" id="disclaimerText"></p>
        <a href="/predict-home"><button class="btn-primary" id="restartBtn">Take it again</button></a>
    </div>

    <footer class="site-footer">Made with ❤️ by ak_junior</footer>
  </div>

  <script>
    const countries = [
    "Other",
    "India",
    "USA",
    "Canada",
    "Australia",
    "UK",
    "Germany",
    "Mexico",
    "Turkey",
    "France",
    "Spain",
    "Ireland",
    "Denmark",
    "Japan",
    "Switzerland",
    "Nepal",
    "Italy",
    "Russia",
    "Sri Lanka",
    "Maldives",
    "Pakistan",
    "Bangladesh",
    "Poland",
    "South Korea",
    "China",
    "Brazil",
    "Singapore",
    "New Zealand",
    "Malaysia",
    "Netherlands",
    "UAE",
    "Finland"
    ];
    // To keep the Other at Last Dynamically
    countries.sort((a, b) => {
    if (a === "Other") return 1;  // Push "Other" to the end
    if (b === "Other") return -1; // Keep "Other" at the end
    return a.localeCompare(b);    // Sort everything else alphabetically
    });
    const selectElement = document.getElementById("country-select");
    countries.forEach(country => {
    const option = document.createElement("option");
    option.value = country;
    option.textContent = country;
    selectElement.appendChild(option);
    });
    const form = document.getElementById('prediction-form');
    form.addEventListener('submit', submitForm);

    async function submitForm(event) {
    // 1. Stop the browser from refreshing the page
    event.preventDefault();

    // 2. Change your UI text to indicate processing status
    const displayElement = document.getElementById('result-display');
    displayElement.innerText = "Predicting price... Please wait.";

    // 3. Extract form data values automatically
    const formElement = document.getElementById('prediction-form');
    const formData = new FormData(formElement);
    const payload = Object.fromEntries(formData.entries());   
    // 4. CRITICAL: Explicitly parse numbers so FastAPI doesn't freeze or drop a 422 error
    payload.age = parseInt(payload.age, 10) || 0;
    payload.avg_daily_usage_hours = parseFloat(payload.avg_daily_usage_hours) || 0.0;
    payload.daily_unlocks = parseInt(payload.daily_unlocks, 10) || 0;
    payload.study_hours = parseFloat(payload.study_hours) || 0.0;
    payload.physical_activity_hours = parseFloat(payload.physical_activity_hours) || 0.0;
    payload.sleep_hours_per_night = parseFloat(payload.sleep_hours_per_night) || 0.0;

    try {
        // 5. Send POST request to the backend's /predict endpoint (relative URL,
        //    works whether the app is served locally or deployed elsewhere)
        const response = await fetch('/predict', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        // 6. Check if backend threw an error (like a 422 or 500)
        if (!response.ok) {
            const errorDetails = await response.json();
            console.error("Backend Error Details:", errorDetails);
            displayElement.innerText = `Error (${response.status}): Check developer console for validation issues.`;
            return;
        }

        // 7. Parse successful response
        const data = await response.json();
        console.log("Success Data:", data);
        displayElement.innerText = `${data.predicted_mental_health_score} / 10`;
        const score = `${data.predicted_mental_health_score}`;
        showResults(score);

    } catch (error) {
        // 8. Catch network disconnects, CORS failures, or crashed servers
        console.error("Network or Submission Error:", error);
        displayElement.innerText = "Network Error: Could not connect to the backend server.";
    }
}

const bands = [
  {
    max: 2.5, key: "needs-support", color: "var(--vhigh)", label: "Needs support",
    headline: "This score suggests things have been really hard",
    body: "A low score like this often means several areas — sleep, stress, connection, balance — are all under pressure at once. That's a lot to carry, and it's worth talking to someone soon: a counselor, a doctor, or someone you trust. You don't have to figure this out alone."
  },
  {
    max: 5, key: "getting-by", color: "var(--high)", label: "Getting by",
    headline: "You're managing, but it's taking a toll",
    body: "Your habits and stress levels seem to be pulling against your well-being more than supporting it. Small, specific changes — protecting sleep, cutting back screen time before bed, building in real breaks — tend to move this score the most."
  },
  {
    max: 7.5, key: "steady", color: "var(--mid)", label: "Steady",
    headline: "You're in a reasonably good place",
    body: "Your habits are mostly working in your favor. There's likely still a specific area — sleep, activity, or screen time — that could use a little attention, but overall this reflects a fairly balanced routine."
  },
  {
    max: 10, key: "thriving", color: "var(--low)", label: "Thriving",
    headline: "Your habits are genuinely supporting you",
    body: "This score reflects a strong balance across sleep, activity, and stress management. Whatever you're doing — keep doing it, and notice which habits matter most so you can hold onto them during busier stretches."
  }
];

function showResults(score){
  const pct = Math.round((score / 10) * 100);
  const band = bands.find(b => score <= b.max);

  document.documentElement.style.setProperty('--band-color', band.color);
  document.documentElement.style.setProperty('--pct', pct);
  document.getElementById('bandEyebrow').textContent = band.label;
  document.getElementById('bandHeadline').textContent = band.headline;
  document.getElementById('bandBody').textContent = band.body;

  const disclaimer = (band.key === "needs-support" || band.key === "getting-by")
    ? "This is a reflection tool, not a diagnosis. If you're in crisis or thinking about harming yourself, please reach out to a crisis line or emergency services in your area right away."
    : "This is a reflection tool, not a diagnosis. If things feel harder than this score suggests, a doctor or counselor can help you look at it more closely.";
  document.getElementById('disclaimerText').textContent = disclaimer;
}
 
  </script>
</body>
</html>
